<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" fill="none">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#DDD6FE" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Ambient Wave Ribbons -->
  <path d="M 10 95 C 90 95, 120 40, 200 65 C 280 90, 320 20, 440 60" stroke="url(#waveGrad2)" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M 10 90 C 85 90, 130 45, 210 70 C 290 95, 335 30, 440 65" stroke="url(#waveGrad1)" stroke-width="1.4" fill="none" opacity="0.6"/>
  <path d="M 10 85 C 95 85, 140 50, 220 75 C 300 100, 350 40, 440 70" stroke="url(#waveGrad1)" stroke-width="1.6" fill="none" filter="url(#glow)"/>
  <path d="M 10 80 C 105 80, 150 55, 230 80 C 310 105, 365 50, 440 75" stroke="url(#waveGrad2)" stroke-width="1.4" fill="none" opacity="0.7"/>
  <path d="M 10 75 C 115 75, 160 60, 240 85 C 320 110, 380 60, 440 80" stroke="url(#waveGrad1)" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M 10 70 C 125 70, 170 65, 250 90 C 330 115, 395 70, 440 85" stroke="url(#waveGrad2)" stroke-width="1.0" fill="none" opacity="0.3"/>
</svg>